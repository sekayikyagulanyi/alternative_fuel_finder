<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alternative Fuel Station Finder</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            background: #f3f6fb;
        }

        .chat-wrapper {
            max-width: 760px;
            margin: 40px auto;
        }

        .chat-box {
            height: 500px;
            overflow-y: auto;
            background: #f8fafc;
        }

        .message-row {
            display: flex;
            margin-bottom: 12px;
        }

        .message-row.user {
            justify-content: flex-end;
        }

        .message-bubble {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 18px;
            word-wrap: break-word;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        .agent .message-bubble {
            background: #ffffff;
            color: #212529;
            border-top-left-radius: 6px;
        }

        .user .message-bubble {
            background: #0d6efd;
            color: white;
            border-top-right-radius: 6px;
        }
    </style>
</head>
<body>
    <div class="container chat-wrapper">
        <div class="card border-0 shadow-lg rounded-4">
            <div class="card-header bg-white border-0 pt-4 pb-2 text-center">
                <h1 class="h2 fw-bold mb-0">Alternative Fuel Station Finder</h1>
                <p class="text-muted mb-0 mt-2">Find nearby alternative fuel stations</p>
            </div>

            <div id="chat-box" class="card-body chat-box px-3 px-md-4">
                <div class="message-row agent">
                    <div class="message-bubble">
                        <strong>SK Agent:</strong> What type of fuel are you looking for?
                    </div>
                </div>
            </div>

            <div class="card-footer bg-white border-0 p-3 p-md-4">
                <div class="input-group">
                    <input
                        type="text"
                        id="user-input"
                        class="form-control form-control-lg"
                        placeholder="Type your answer here"
                    >
                    <button id="send-button" class="btn btn-primary px-4" type="button">
                        Send
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
